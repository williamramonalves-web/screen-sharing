<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste de compartilhamento</title>
<style>
body{font-family:system-ui,sans-serif;background:#f4f7fb;color:#172033;max-width:760px;margin:0 auto;padding:28px 18px}main{background:white;border-radius:18px;padding:28px;box-shadow:0 8px 30px #19345d18}h1{margin-top:0}button{border:0;border-radius:10px;padding:12px 16px;background:#2457d6;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#e8eefc;color:#173b9d}input{padding:12px;border:1px solid #cbd5e1;border-radius:10px;width:180px;text-transform:uppercase}section{border-top:1px solid #e5eaf2;margin-top:22px;padding-top:20px}.code{font-size:24px;letter-spacing:4px;font-weight:800;margin:12px 0}.status{padding:12px;border-radius:10px;background:#eef5ff;margin-top:16px}video{width:100%;margin-top:18px;background:#0b1220;border-radius:12px;max-height:480px}small{color:#5d6b83}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}</style>
</head>
<body><main>
<h1>Teste de compartilhamento de tela</h1>
<p>Teste simples para descobrir se o navegador e a rede conseguem usar WebRTC.</p>
<section><h2>1. Compartilhar minha tela</h2><button id="start">Iniciar compartilhamento</button><div id="room"></div></section>
<section><h2>2. Assistir alguém</h2><div class="row"><input id="code" maxlength="8" placeholder="Código da sala"><button class="secondary" id="join">Assistir</button></div></section>
<div class="status" id="status">Aguardando uma ação.</div><video id="video" autoplay playsinline controls></video>
<p><small>Não há login. A tela vai diretamente para o outro navegador. Feche a aba ao terminar.</small></p>
</main>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=id=>document.getElementById(id), status=t=>$('status').textContent=t;
let peer,call,stream;
function code(){return Math.random().toString(36).slice(2,8).toUpperCase()}
$('start').onclick=async()=>{try{const id=code(); peer=new Peer('teste-'+id.toLowerCase()); $('start').disabled=true; $('room').innerHTML='<div>Informe este código para quem vai assistir:</div><div class="code">'+id+'</div>'; status('Escolha a tela na janela do navegador.'); stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true}); $('video').srcObject=stream; peer.on('connection',conn=>{conn.on('open',()=>{status('Espectador conectado.');call=peer.call(conn.peer,stream);});}); peer.on('error',e=>status('Erro de conexão: '+e.type)); stream.getVideoTracks()[0].onended=()=>{status('Compartilhamento encerrado.');peer.destroy();};}catch(e){status('Não foi possível compartilhar: '+(e.message||e.name));}}
$('join').onclick=()=>{try{const c=$('code').value.trim().toLowerCase();if(!c)return status('Digite o código da sala.'); peer=new Peer();peer.on('open',()=>{status('Solicitando conexão...');const conn=peer.connect('teste-'+c);conn.on('open',()=>status('Aguardando a tela...'));});peer.on('call',c=>{call=c;c.answer();c.on('stream',s=>{$('video').srcObject=s;status('Conectado e recebendo a tela.');});c.on('error',()=>status('Falha ao receber a transmissão.'));});peer.on('error',e=>status('Erro de conexão: '+e.type));}catch(e){status('Não foi possível conectar: '+e.message)}};
</script></body></html>
